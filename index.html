<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis XV Ashley</title>

<style>
body {
    margin: 0;
    background: #f8ddea;
    overflow: hidden;
}

.container {
    position: relative;
    width: 100%;
    max-width: 500px;
    height: 100vh;
    margin: auto;
}

.container img {
    width: 100%;
    height: 100vh;
    object-fit: cover;
    display: block;
    cursor: pointer;
}

.sobre {
    transition: transform 0.7s ease, opacity 0.7s ease;
}

.sobre.zoom {
    transform: scale(1.06);
    opacity: 0.95;
}

.estrella {
    position: fixed;
    color: #ffd36a;
    font-size: 22px;
    text-shadow: 0 0 10px white;
    animation: explosion 1s ease-out forwards;
    z-index: 999;
    pointer-events: none;
}

@keyframes explosion {
    0% {
        opacity: 1;
        transform: scale(0.3);
    }
    100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(2.2);
    }
}
</style>
</head>

<body>

<div class="container">
    <img src="sobre.png" class="sobre" id="sobre" onclick="abrirInvitacion()">
</div>

<audio id="sonido">
    <source src="magic.mp3" type="audio/mpeg">
</audio>

<script>
function crearEstrellas() {
    for (let i = 0; i < 28; i++) {
        const estrella = document.createElement("div");
        estrella.className = "estrella";
        estrella.innerHTML = "✦";

        const x = (Math.random() * 320 - 160) + "px";
        const y = (Math.random() * 320 - 160) + "px";

        estrella.style.left = "50%";
        estrella.style.top = "58%";
        estrella.style.setProperty("--x", x);
        estrella.style.setProperty("--y", y);

        document.body.appendChild(estrella);

        setTimeout(() => estrella.remove(), 1000);
    }
}

function abrirInvitacion() {
    const sobre = document.getElementById("sobre");
    const sonido = document.getElementById("sonido");

    sonido.currentTime = 0;
    sonido.play().catch(() => {});

    sobre.classList.add("zoom");
    crearEstrellas();

    setTimeout(() => {
        window.location.href = "invitacion.html";
    }, 900);
}
</script>

</body>
</html>
